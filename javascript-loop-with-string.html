<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="mult" style="text-align: center;" >
        <h2>Vowel Letters: (A, E , I , O ,U)</h2>
        <input type="text" id="input-btn">
        <button id="add">submit</button>
        <h1 id="word"></h1>
    </div>
</body>
<script>
document.getElementById("add").addEventListener("click",function(){
       document.getElementById("word").innerHTML=``
     var word=document.getElementById("input-btn").value
     const vowels=["a","e","o","i","u"]
     for(var char of word){
        var lowar = char.toLowerCase()
        if(!vowels.includes(lowar))
          document.getElementById("word").innerHTML+=`${char} <br>`
    }
    document.getElementById("input-btn").value=""
})
</script>
</html>
