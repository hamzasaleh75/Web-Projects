<!DOCTYPE html>
<html lang="en">
<head>
  <style>
    table,th,td{
      border: 1px solid white;
      text-align: center;
    }
  </style>
</head>
<body>
    <div style="width: 100%;height: 100vh;display: flex;justify-content: center;align-items: center;background-color: rgb(53,0,50)">
    <table id="students" style="width: 50%;font-size: 50px;color: white;">
      <tr>
        <th>Name</th>
        <th>Age</th>
        <th>year</th>
      </tr>
    </table>
  </div>
</body>
</html>

</body>
<script>  
    let students = [
  {
    firstName: "Khaled",
    lastName: "Omar",
    age: 15,
    year: "2000",
    PrintFullName: function(){
      console.log(this.firstName + " " + this.lastName);
    }
  },
  {
    firstName: "Ahmad",
    lastName: "Omar",
    age: 15,
    year: "2002",
    PrintFullName: function(){
      console.log(this.firstName + " " + this.lastName);
    }
  },
  {
    firstName: "Sami",
    lastName: "Omar",
    age: 15,
    year: "2010",
    PrintFullName: function(){
      console.log(this.firstName + " " + this.lastName);
    }
  },
  {
    firstName: "Hamza",
    lastName: "Saleh",
    age: 20,
    year: "2005",
    PrintFullName: function(){
      console.log(this.firstName + " " + this.lastName);
  }
}
]
for (st of students){
  let content=`<tr> 
    <td> ${st.firstName}</td>
    <td>${st.age}</td>
    <td>${st.year}</td>
    </tr>`
  document.getElementById("students").innerHTML+=content
}
</script>
</html>
