<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
    <div id="number" style="font-size: 50px;text-align: center;"></div>
    <div id="num"></div>
</body>
<script>
  for(var i=1;i<=10;i++){
    document.getElementById("number").innerHTML+="<br>"+"Multiplication Table Of "+ i+"<br>"
    for(var j=1;j<=10;j++){
        var x=1
       var c= i + "*"+ j+ " = "
       x=i*j
       document.getElementById("number").innerHTML+=c+x+"<br>"
        console.log(c)
        console.log(x)
    }
    document.getElementById("number").innerHTML+="<hr>"
  }
</script>
</html>
